<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F0">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cüzdan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cüzdan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek sütunlu telefon uygulaması; beyaz kartlar, renk anlam taşır (yeşil gelir, kırmızı gider, mavi yatırım), canlılık mercan vurgu ve kategori renklerinden gelir */
:root {
  /* Bilerek tek, açık tema: cihaz koyu modda olsa da açık görünür */
  color-scheme: light;
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f1f3f9;
  --ink: #14213d;
  --ink-2: #4b5574;
  --muted: #8a93a8;
  --line: #e6eaf2;
  --primary: #ff7a45;
  --primary-ink: #e85d24;
  --primary-soft: #fff0ea;
  --in: #12b76a;
  --in-ink: #0a8a4f;
  --in-soft: #e7f8ef;
  --out: #f04438;
  --we: #f7efe9; --we-has: #efe3da;
  --out-ink: #d92d20;
  --out-soft: #feeceb;
  --inv: #3b6fe0;
  --inv-soft: #e9f0ff;
  --warn: #b76e00;
  --warn-soft: #fff5dd;
  --shadow: 0 1px 2px rgba(20, 33, 61, .04), 0 6px 20px rgba(20, 33, 61, .06);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background:
  radial-gradient(620px 460px at -10% -5%, #ffd2bd 0%, transparent 70%),
  radial-gradient(600px 480px at 110% 10%, #d8cfff 0%, transparent 70%),
  radial-gradient(560px 460px at -10% 70%, #cdeeff 0%, transparent 70%),
  radial-gradient(640px 520px at 100% 100%, #c8f1dd 0%, transparent 70%),
  #f4f1fb; background-attachment: fixed; }
body { color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app {
  max-width: 460px; margin: 0 auto; min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(112px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hero { position: relative; }
.hero .pw { position: absolute; z-index: 2; top: 14px; right: 14px; width: 36px; height: 36px; background: var(--surface-2); color: var(--ink-2); box-shadow: none; }
.hero .pw.on { background: var(--surface-2); color: var(--in-ink); }
.hero .pw svg.i { width: 18px; height: 18px; }
.hello { min-width: 0; }
.hello small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.hello b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-r { display: flex; align-items: center; gap: 8px; flex: none; }
.month { display: flex; align-items: center; background: var(--surface); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.month button { width: 32px; height: 32px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.month button:disabled { opacity: .25; cursor: default; }
.month span { min-width: 76px; text-align: center; font-weight: 700; font-size: 13.5px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); }

.chip-note { display: flex; align-items: center; gap: 8px; background: var(--primary-soft); color: var(--primary-ink); border-radius: 12px; padding: 8px 8px 8px 12px; font-size: 13px; font-weight: 600; }
.chip-note span { flex: 1; min-width: 0; }
.chip-note button { border: 0; background: var(--surface); color: var(--primary-ink); font-weight: 700; font-size: 12.5px; border-radius: 8px; padding: 6px 10px; white-space: nowrap; }

.card { background: var(--surface); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-h h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.card-h small { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.link { border: 0; background: none; color: var(--primary-ink); font-weight: 700; font-size: 13px; padding: 4px 0; white-space: nowrap; }

/* Bakiye */
.hero { position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; width: 200px; height: 200px; right: -70px; top: -80px; border-radius: 50%; background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
.hero .big { font-size: 42px; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin-top: 2px; }
.hero .big.neg { color: var(--out); }
.hero .bud { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 0; margin-top: 10px; color: var(--ink-2); font: inherit; font-size: 13px; }
.hero .bud .t { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
.hero .bud .d { color: var(--muted); }
.hero .bud b { color: var(--ink); font-weight: 800; }
.hero .bud .bar { display: block; height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.hero .bud .bar i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }
.hero .bud.over b, .hero .bud.over .t { color: var(--out); }
.hero .bud.over .bar i { background: var(--out); }
.bud-form { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.bud-form input { width: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font: inherit; font-weight: 700; background: var(--surface); color: var(--ink); }
.bud-form button { border: 0; background: var(--primary); color: #fff; font-weight: 700; border-radius: 10px; padding: 8px 12px; }
.fx-who { display: flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 0 0 4px; }
.fx-who .sep { margin: 0 8px; color: var(--muted); }
.hero .after { font-size: 20px; font-weight: 800; letter-spacing: -.02em; color: var(--ink-2); margin-top: 4px; }
.hero .after span { color: var(--muted); font-weight: 600; font-size: 16px; }
.hero .after.neg { color: var(--ink-2); }
.hero .pending { font-size: 13px; color: var(--ink-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.hero .pending i { width: 6px; height: 6px; border-radius: 50%; background: #f5a524; flex: none; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); display: flex; gap: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.bar-cap { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
.bar-cap span { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.qa button { border: 0; border-radius: 14px; padding: 11px 4px; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.qa svg.i { width: 18px; height: 18px; stroke-width: 2.5; }
.qa .in { background: var(--in-soft); color: var(--in-ink); }
.qa .out { background: var(--out-soft); color: var(--out-ink); }
.qa .inv { background: var(--inv-soft); color: var(--inv); }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .ti { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 6px; }
.tile .ti svg.i { width: 17px; height: 17px; stroke-width: 2.4; }
.tile .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 17px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile small { font-size: 11.5px; color: var(--ink-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile small b { color: var(--muted); font-weight: 700; }
.tile.in .ti { background: var(--in-soft); color: var(--in); } .tile.in .v { color: var(--in-ink); }
.tile.out .ti { background: var(--out-soft); color: var(--out); } .tile.out .v { color: var(--out-ink); }
.tile.inv .ti { background: var(--inv-soft); color: var(--inv); } .tile.inv .v { color: var(--inv); }

.budget-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.budget-row b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.budget-row span { color: var(--muted); font-size: 13px; font-weight: 600; }
.inline-form { display: flex; gap: 8px; }
.inline-form input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; background: var(--primary); color: #fff; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.danger { background: none; color: var(--out-ink); }

/* Pasta */
.donut-row { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 16px; align-items: center; }
.donut-row svg { width: 136px; height: 136px; }
.legend { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.legend div { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.legend .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); font-weight: 600; }
.legend em { font-style: normal; font-weight: 800; }
.legend em small { color: var(--muted); font-weight: 600; margin-left: 5px; }
@media (max-width: 370px) { .donut-row { grid-template-columns: 1fr; justify-items: center; } .legend { width: 100%; } }

/* Sabit giderler */
.fx-list { display: flex; flex-direction: column; }
.fx-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 0; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; font: inherit; color: inherit; }
.fx-row.inrow { grid-template-columns: 22px minmax(0, 1fr) auto; }
.chk.sm { width: 22px; height: 22px; border-radius: 7px; }
.chk.sm svg.i { width: 13px; height: 13px; }
.fx-row.inrow .fx-main { border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; }
.got-form { display: flex; align-items: center; gap: 8px; padding: 6px 0 10px 30px; font-size: 13px; color: var(--ink-2); }
.got-form input { width: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font: inherit; font-weight: 700; background: var(--surface); color: var(--ink); }
.got-form button { border: 0; background: var(--in); color: #fff; font-weight: 700; border-radius: 10px; padding: 8px 12px; }
.fx-day { font-weight: 700; font-size: 14.5px; color: var(--ink-2); text-align: right; }
.fx-row .fx-main { display: flex; flex-direction: row; align-items: center; gap: 6px; min-width: 0; }
.fx-row .fx-main > b { flex: 0 1 auto; min-width: 0; }
.fx-row .fx-main .badge, .fx-row .fx-main .who { flex: none; }
.fx-row .left { flex: none; font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.fx-row .left.late { color: var(--out-ink); }
.fx-row.done .fx-main b, .fx-row.done .fx-day { color: var(--muted); }
.fx-row:first-child { border-top: 0; }
.chk { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; padding: 0; position: relative; }
.chk::before { content: ""; position: absolute; inset: -7px; }
.chk svg.i { width: 16px; height: 16px; stroke-width: 3; }
.chk:hover { border-color: var(--in); }
.chk[aria-pressed="true"] { background: var(--in); border-color: var(--in); color: #fff; }
.chk.auto { border-style: dashed; border-color: var(--muted); }
.fx-main { border: 0; background: none; padding: 0; text-align: left; min-width: 0; display: flex; flex-direction: column; }
.fx-main .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.fx-main b { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fx-main .l2 { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fx-main .l2 .paid { color: var(--in-ink); font-weight: 700; }
.fx-main .l2 .auto { color: var(--ink-2); font-weight: 700; }
.badge { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 99px; background: var(--inv-soft); color: var(--inv); flex: none; }
.badge.soon { background: var(--warn-soft); color: var(--warn); }
.fx-amt { color: var(--out-ink); font-weight: 800; font-size: 14.5px; }
.fx-row.done .fx-amt { color: var(--in-ink); }
.fx-row.done { position: relative; }
.fx-row.done .fx-main b, .fx-row.done .fx-day { color: var(--muted) !important; opacity: .8; }
.fx-row.done::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--muted); opacity: .7; pointer-events: none; }
.fx-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--surface-2); border-radius: 16px; padding: 12px; margin: 4px 0 8px; }
.fld { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
.fld input { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 15px; color: var(--ink); width: 100%; min-width: 0; font-weight: 500; }
.fld.full { grid-column: 1 / -1; }
.endrow { display: flex; gap: 10px; align-items: center; }
.endrow input[type="month"] { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 10px; font-size: 15px; color: var(--ink); }
.endrow input:disabled { opacity: .4; }
.chkl { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); font-weight: 600; white-space: nowrap; }
.chkl input { width: 18px; height: 18px; accent-color: var(--primary); }
.fx-form .btns { grid-column: 1 / -1; display: flex; gap: 8px; }
.fx-form .btns .danger { margin-left: auto; }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }

/* Liste satırları */
.list { display: flex; flex-direction: column; }
.cmp .row { grid-template-columns: 30px minmax(0, 1fr) auto; gap: 9px; padding: 5px 0; }
.cmp .ico { width: 30px; height: 30px; border-radius: 10px; font-size: 14px; }
.cmp .ico svg.i { width: 15px; height: 15px; }
.cmp .row .t b { font-size: 13.5px; }
.cmp .row .t small { font-size: 11px; }
.cmp .amt { font-size: 14px; }
.cmp-tab { display: grid; gap: 4px; font-size: 12.5px; }
.cmp-tab div { display: grid; grid-template-columns: minmax(0, 1.4fr) 1fr 1fr 1fr; gap: 6px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
.cmp-tab div.h { border: 0; color: var(--muted); font-size: 11px; font-weight: 700; }
.cmp-tab span { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.cmp-tab b { text-align: right; font-weight: 700; }
.cmp-tab .h span:not(:first-child) { justify-content: flex-end; }
.row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border: 0; background: none; text-align: left; width: 100%; }
.list .row + .row { border-top: 1px solid var(--line); }
.ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 19px; }
.row .t { min-width: 0; }
.row .t b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t small { color: var(--muted); font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amt { font-weight: 800; text-align: right; white-space: nowrap; }
.amt.in { color: var(--in-ink); } .amt.out { color: var(--ink); } .amt.inv { color: var(--inv); }
.day-h { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: rgba(246, 247, 251, .88); backdrop-filter: blur(8px); border-radius: 10px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 12px 4px 6px; }
.day-card { background: var(--surface); border-radius: 18px; padding: 2px 14px; box-shadow: var(--shadow); }
.day-card .row + .row { border-top: 1px solid var(--line); }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 14px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 14px; padding: 0 12px; box-shadow: var(--shadow); color: var(--muted); }
.hk-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.hk-bar .search { min-width: 0; }
.hk-bar .hk-btn { padding: 0 11px; }
.hk-bar .search input { padding: 10px 0; }
.hk-btn { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13.5px; color: var(--ink-2); }
.hk-btn svg.i { width: 17px; height: 17px; }
.hk-btn[aria-pressed="true"] { background: var(--ink-2); color: var(--surface); }
.hk-btn em { font-style: normal; background: var(--primary); color: #fff; border-radius: 99px; min-width: 18px; height: 18px; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
.hk-menu { display: grid; gap: 10px; padding: 12px 14px; }
.hk-sec > span { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.hk-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hk-chips .pick { padding: 6px 10px; font-size: 12.5px; }
.hk-chips .pick svg.i { width: 13px; height: 13px; }
.pick.on { background: var(--primary-soft); color: var(--primary-ink); }
.hk-foot { display: flex; justify-content: flex-end; gap: 8px; }
.btn-s { border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 13px; background: var(--surface-2); color: var(--ink-2); }
.btn-s.pri { background: var(--primary); color: #fff; }
.btn-s:disabled { opacity: .45; }
.hk-sum { display: flex; gap: 14px; justify-content: center; font-size: 12.5px; color: var(--muted); }
.hk-sum b { color: var(--ink); margin-left: 3px; }
.hk .row { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; padding: 6px 0; }
.hk .ico { width: 34px; height: 34px; border-radius: 11px; font-size: 16px; }
.hk .ico svg.i { width: 17px; height: 17px; }
.hk .row .t b { font-size: 14px; }
.hk .row .t small { font-size: 11.5px; }
.hk .day-h { padding: 8px 4px 4px; font-size: 11px; }
.hk .day-card { border-radius: 14px; padding: 1px 12px; }
.search input { flex: 1; border: 0; background: none; padding: 12px 0; outline: none; min-width: 0; color: var(--ink); }

.seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 8px 4px; font-weight: 700; color: var(--muted); font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(20,33,61,.1); }
.seg.type button[data-v="out"][aria-pressed="true"] { background: var(--out); color: #fff; }

  const PINK = KEY + '-pin';

  function lockScreen() {

      ${mode === 'new1' && !err ? `<button class="lk-forgot" data-later>Sonra hatırlat</button>` : forgot ? `<div class="lk-fg">PIN bilinmeden kayıtlar açılamaz. Sıfırlarsan bu telefondaki <b>tüm kayıtlar silinir</b> (yedeğin varsa sonra yükleyebilirsin).<button data-wipe>Kayıtları sil ve sıfırla</button><button data-fgx>Vazgeç</button></div>` : `<button class="lk-forgot" data-forgot>PIN'i unuttum</button>`}</div>`; };
    const press = async k => {
      if (k === '⌫') v = v.slice(0, -1); else if (v.length < 4) v += k;
      err = false; draw();
      if (v.length === 4) {
        if (mode === 'new1') { first = v; v = ''; mode = 'new2'; return draw(); }
        if (mode === 'new2') { if (v === first) { const h = await pinHash(v); try { localStorage.setItem(PINK, h); localStorage.setItem(PINK + 'At', Date.now()); } catch (er) {} return done(); } v = ''; mode = 'new1'; err = 'PIN\'ler aynı değil, baştan gir'; return draw(); }

  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };

  const ui = { who: 'all', lastPayer: 'p1', per: '6', from: ymAdd(curYm, -11), acat: 'all', restore: null, tab: 'ozet', ym: curYm, filter: 'all', q: '', aType: 'out', kType: 'out', editFx: null, editIn: null, gotAsk: null, closing: false, closeDt: '', editBudget: false, selDay: null, confirmClear: false, acats: [], yearView: false, fOpen: false, mOpen: false, fCats: [], fWho: [], fNoFx: false, xMonths: [], last: {} };
  try { const t = localStorage.getItem(KEY + '-tab'); if (t && t !== 'kategori' && t !== 'ayarlar') ui.tab = t; } catch (e) {}

  const catOf = (type, id) => db.cats[type].find(c => c.id === id) || { name: 'Silinmiş kategori', ic: 'dots', color: GRAY };

  const icoBox = (c, cls) => `<div class="${cls || 'ico'}" style="background:color-mix(in srgb, ${c.color} 15%, transparent);color:${c.color}">${catIcon(c)}</div>`;

  // Sabit gider durumu: işaretlendiyse "paid", ödeme günü geçtiyse "auto" (otomatik gider), yoksa "wait"
  function fixedState(f, ym) {
    if (ym < f.start || (f.end && ym > f.end)) return null;
    if ((f.every || 1) > 1) { const d = ymDiff(ym, f.anchor || f.start); if (d < 0 || d % f.every) return null; }

    const p = db.paid[ym + '|' + f.id];

    // Otomatik çekilenler vade günü kendiliğinden ödenmiş sayılır; elle ödenenler işaretlenene kadar bekler (vadesi geçtiyse "late")
    if (due <= todayIso) return f.manual ? { status: 'late', due, amount: f.amount } : { status: 'auto', due, date: due, amount: f.amount };
    return { status: 'wait', due, amount: f.amount };
  }
  const fixedTx = ym => db.fixed.map(f => {

    return { id: 'fx|' + ym + '|' + f.id, fx: f.id, type: 'out', cat: 'sabit', amount: st.amount, date: st.date, note: f.name, auto: st.status === 'auto', payer: payerOf(f) };
  }).filter(Boolean);
  // Analiz sekmesinde kişi filtresi (kişi 1 / kişi 2) bütün hesaplara uygulanır

  function donutSvg(items, total, label, color) {

  /* ---------- Özet ---------- */

  const closeMax = ym => { const e = ymAdd(ym, 1) + '-01', last = iso(new Date(new Date(e) - 864e5)); return todayIso < last ? todayIso : last; };

  }

  // Elle ödenen sabit giderler: vadeye 2 gün kala, vade günü ve gecikince Özet'in üstünde hatırlatılır (bu ay ve geçen ay)

  // Haftalık harcama (KW): Ekim 2026'dan bu haftaya kadar, en yeni hafta üstte; sabit giderler hariç, dokununca kalemler açılır

    const ins = [];
    const outV = Object.entries(mt.filter(t => t.type === 'out' && !t.fx).reduce((a, t) => (a[t.cat] = (a[t.cat] || 0) + t.amount, a), {})).sort((a, b) => b[1] - a[1]);
    if (outV.length) ins.push(['cart', '#2a78d6', `Sabit giderler dışında en çok <b>${esc(catOf('out', outV[0][0]).name)}</b> için harcadın: ${money(outV[0][1])}`]);
    if (vk && ui.ym <= curYm) ins.push(['clock', '#eb6834', `Günlük ortalama değişken harcaman <b class="num">${money(Math.round(vk / daysIn))}</b>`]);
    const pO = b.data[4].o;
    if (pO && ui.ym <= curYm) { const ch = Math.round((gd - pO) / pO * 100); ins.push([ch > 0 ? 'up' : 'down', ch > 0 ? 'var(--out)' : 'var(--in)', `Gider geçen aya göre <b>%${Math.abs(ch)} ${ch > 0 ? 'arttı' : 'azaldı'}</b>${ui.ym === curYm ? ' (ay henüz bitmedi)' : ''}`]); }
    if (gi) ins.push(['wallet', 'var(--inv)', gi >= gd + gv ? `Gelirinin <b>%${Math.round((gi - gd - gv) / gi * 100)}</b> kadarı elinde kaldı, <b>%${Math.round(gv / gi * 100)}</b> kadarını yatırdın` : `Bu ay gelirinden <b class="num">${money(gd + gv - gi)}</b> fazla çıktı`]);
    if (ui.ym === curYm && vk && daysIn > 3) { const dim = new Date(Y, M, 0).getDate(); const proj = vk / daysIn * dim; ins.push(['trend', '#6250d6', `Bu hızla ay sonunda değişken harcaman <b class="num">${eur(proj)}</b> olur${db.budget ? (proj > db.budget ? `, bütçeyi <b>${eur(proj - db.budget)}</b> aşar` : `, bütçenin içinde kalır`) : ''}`]); }
    const last3 = db.tx.filter(t => t.type === 'out' && t.date > ymAdd(ui.ym, -3) + '-31' && ymOf(t.date) <= ui.ym);
    const byNote = {}; last3.filter(t => t.note).forEach(t => { const k = t.note; byNote[k] = byNote[k] || { n: 0, v: 0 }; byNote[k].n++; byNote[k].v += t.amount; });
    const topNote = Object.entries(byNote).sort((a, b) => b[1].n - a[1].n || b[1].v - a[1].v)[0];
    if (topNote && topNote[1].n > 2) ins.push(['cart', '#e87ba4', `Son 3 ayda en sık <b>${esc(topNote[0])}</b>: ${topNote[1].n} kez, toplam ${eur(topNote[1].v)}`]);
    const wd = [0, 0, 0, 0, 0, 0, 0]; last3.forEach(t => { const [a, b, c] = t.date.split('-').map(Number); wd[new Date(a, b - 1, c).getDay()] += t.amount; });
    const wmax = wd.indexOf(Math.max(...wd)); if (last3.length > 5) ins.push(['calendar', '#0891b2', `En çok <b>${GUN[wmax]}</b> günleri harcıyorsun (son 3 ay)`]);
    db.fixed.filter(f => f.end && ymDiff(f.end, curYm) >= 0 && ymDiff(f.end, curYm) < 3)
      .forEach(f => ins.push(['alert', '#b76e00', `<b>${esc(f.name)}</b> ${AYLAR[+f.end.slice(5) - 1]} ${f.end.slice(0, 4)} sonunda bitiyor. İptal ya da yenileme kararını şimdiden ver.`]));

    let share = '';
    if (ui.who === 'all') {
      const all = db.tx.filter(t => t.type === 'in' && txYm(t) === ui.ym).concat(incomeTx(ui.ym)), tot = all.reduce((a, t) => a + t.amount, 0);
      const parts = PEOPLE().map(p => [p, all.filter(t => payerOf(t) === p).reduce((a, t) => a + t.amount, 0)]).filter(([, v]) => v);
      if (tot && parts.length > 1) share = `<p class="hint">Hane geliri ${eur(tot)}: ${parts.map(([p, v]) => `${esc(PAYER[p])} <b>%${Math.round(v / tot * 100)}</b>`).join(', ')}.</p>`;
    }
    return `<div class="seg" style="--n:${PEOPLE().length + 1}" role="group" aria-label="Kimin analizi">${[['all', 'Hane']].concat(PEOPLE().map(p => [p, PAYER[p]])).map(([v, l]) => `<button data-who="${v}" aria-pressed="${ui.who === v}">${v === 'all' ? '' : `<span class="who sm ${v}">${l[0]}</span>`}${l}</button>`).join('')}</div>
      ${share}
      <section class="card">
        <div class="card-h">${foldH('ad', 'Kategori dağılımı', `<small>${AYLAR[+ui.ym.slice(5) - 1]} · <b class="num" style="color:var(--ink)">${eur(total)}</b> ${TN[ui.aType].toLocaleLowerCase('tr-TR')}</small>`)}</div>
        ${isOpen('ad') ? `<div class="seg type">
          <button data-at="out" data-v="out" aria-pressed="${ui.aType === 'out'}">Gider</button>
          <button data-at="in" data-v="in" aria-pressed="${ui.aType === 'in'}">Gelir</button>
          <button data-at="inv" data-v="inv" aria-pressed="${ui.aType === 'inv'}">Yatırım</button>
        </div>
        ${ui.aType === 'inv' ? `<div class="budget-row"><span>Bugüne kadar toplam yatırım</span><b class="num" style="color:var(--inv)">${eur(invTotal(ui.ym))}</b></div>` : ''}
        ${rows.length ? `<div class="donut-row">${donutSvg(items, total, 'Toplam ' + TN[ui.aType].toLocaleLowerCase('tr-TR'), `var(--${ui.aType === 'inv' ? 'inv' : ui.aType + '-ink'})`)}
          <div class="legend">${items.map(x => `<div><span class="dot" style="background:${x.color}"></span><span class="n">${esc(x.name)}</span><em class="num">%${Math.round(x.v / total * 100)}</em></div>`).join('')}</div>
        </div>
        <div class="list cmp">${rows.map(([id, v]) => {
          const c = catOf(ui.aType, id), p = pby[id] || 0;
          const chg = p ? Math.round((v - p) / p * 100) : null;
          const good = ui.aType === 'out' ? chg < 0 : chg > 0;
          return `<div class="row">${icoBox(c)}<div class="t"><b>${esc(c.name)}</b><small>${list.filter(t => t.cat === id).length} kayıt${chg ? ` · <span class="chg" style="color:var(${good ? '--in-ink' : '--out-ink'})">${chg > 0 ? '↑' : '↓'} %${Math.abs(chg)}</span> geçen aya göre` : ''}${id === 'market' && ui.aType === 'out' ? (t => t ? ` · TM ${money(t)}` : '')(list.filter(t => t.cat === 'market' && t.tm).reduce((a, t) => a + t.amount, 0)) : ''}</small></div><div class="amt num ${ui.aType}">${money(v)}</div></div>`;
        }).join('')}</div>`
        : `<div class="empty">Bu ay ${TN[ui.aType].toLocaleLowerCase('tr-TR')} kaydı yok.</div>`}` : ''}
      </section>
      <section class="card bars">
        <div class="card-h"><h2>Son 6 ay</h2><div class="keys"><span><i class="dot" style="background:var(--in)"></i>Gelir</span><span><i class="dot" style="background:var(--out)"></i>Gider</span></div></div>
        ${b.svg}
      </section>
      ${catAnalysis()}
      ${ins.length ? `<section class="card"><div class="card-h"><h2>Bu ay kısaca</h2></div><ul class="insights">${ins.slice(0, 3).map(([i, col, t]) => `<li><i style="background:color-mix(in srgb, ${col} 14%, transparent);color:${col}">${svg(i)}</i><span>${t}</span></li>`).join('')}</ul></section>` : ''}`;
  }

  // Kategori analizi: dönem + kategori seçimi, aylık çubuk grafik ve toplamlar
  function catAnalysis() {
    const endYm = ui.ym > curYm ? curYm : ui.ym;
    let startYm = ui.per === '6' ? ymAdd(endYm, -5) : ui.per === '12' ? ymAdd(endYm, -11) : (ui.from <= endYm ? ui.from : endYm);
    if (ymDiff(endYm, startYm) > 35) startYm = ymAdd(endYm, -35);
    const months = []; for (let ym = startYm; ym <= endYm; ym = ymAdd(ym, 1)) months.push(ym);
    const cats = db.cats.out;
    ui.acats = ui.acats.filter(id => cats.some(k => k.id === id));
    ui.acat = ui.acats.length === 1 ? ui.acats[0] : 'all';
    const perSeg = `<div class="seg" style="--n:3">${[['6', 'Son 6 ay'], ['12', 'Son 1 yıl'], ['from', 'Tarihten']].map(([v, l]) => `<button data-per="${v}" aria-pressed="${ui.per === v}">${l}</button>`).join('')}</div>
      ${ui.per === 'from' ? `<label class="fld">Başlangıç ayı<input type="month" id="fromIn" value="${ui.from}" max="${curYm}"></label>` : ''}`;
    const chips = `<div class="hscroll ac" role="group" aria-label="Kategori seç (birden fazla seçebilirsin)">
        <button class="pick" data-acat="all" aria-pressed="${!ui.acats.length}"><i class="dot" style="background:#7b8aa3"></i>Tüm giderler</button>
        ${cats.map(k => `<button class="pick" data-acat="${k.id}" aria-pressed="${ui.acats.includes(k.id)}"><i class="dot" style="background:${k.color}"></i>${esc(k.name)}</button>`).join('')}
      </div>`;
    const range = `${AY_K[+startYm.slice(5) - 1]} ${startYm.slice(0, 4)} – ${AY_K[+endYm.slice(5) - 1]} ${endYm.slice(0, 4)}`;
    const savedHtml = savedCard(months, range);
    if (ui.acats.length > 1) {
      const series = ui.acats.map(id => { const k = catOf('out', id); return { k, vals: months.map(ym => monthTx(ym).filter(t => t.type === 'out' && t.cat === id).reduce((a, t) => a + t.amount, 0)) }; });
      const mx2 = niceMax(Math.max(1, ...series.flatMap(x => x.vals)));
      const W = 340, H = 170, L = 40, T = 14, B = 22, ch = H - T - B, slot = (W - L) / months.length;
      const y = v => T + ch - v / mx2 * ch, xc = k => L + slot * k + slot / 2;
      let g = '';
      [0, .5, 1].forEach(f => { const yy = y(mx2 * f); g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${short(mx2 * f)}</text>`; });
      const step = Math.ceil(months.length / 12);
      months.forEach((ym, k) => { if (k % step === 0) g += `<text x="${xc(k)}" y="${H - 6}" text-anchor="middle">${AY_K[+ym.slice(5) - 1]}</text>`; });
      series.forEach(({ k, vals }) => {
        g += `<polyline fill="none" stroke="${k.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${vals.map((v, i) => xc(i) + ',' + y(v)).join(' ')}"/>`;
        vals.forEach((v, i) => g += `<circle cx="${xc(i)}" cy="${y(v)}" r="3" fill="${k.color}"><title>${esc(k.name)} · ${AYLAR[+months[i].slice(5) - 1]}: ${money(v)}</title></circle>`);
      });
      return `<section class="card bars">
      <div class="card-h"><h2>Kıyaslama</h2><small>${range}</small></div>
      ${perSeg}${chips}
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kategorilerin aylık karşılaştırması">${g}</svg>
      <div class="cmp-tab"><div class="h"><span></span><span>Toplam</span><span>Ort./ay</span><span>Son ay</span></div>${series.map(({ k, vals }) => { const t = vals.reduce((a, v) => a + v, 0); return `<div><span><i class="dot" style="background:${k.color}"></i>${esc(k.name)}</span><b class="num">${eur(t)}</b><b class="num">${eur(t / months.length)}</b><b class="num">${eur(vals[vals.length - 1])}</b></div>`; }).join('')}</div>
      <p class="hint">Birden fazla kategori seçtin; her çizgi bir kategori. Tek kategoriye dönmek için diğerlerine tekrar dokun.</p>
    </section>${savedHtml}`;
    }
    const c = ui.acat === 'all' ? { name: 'Tüm giderler', color: '#7b8aa3' } : catOf('out', ui.acat);
    const vals = months.map(ym => monthTx(ym).filter(t => t.type === 'out' && (ui.acat === 'all' || t.cat === ui.acat)).reduce((a, t) => a + t.amount, 0));
    const allOut = months.reduce((a, ym) => a + sum(monthTx(ym), 'out'), 0);
    const tot = vals.reduce((a, v) => a + v, 0), avg = tot / months.length;
    // Market seçiliyken Türk marketi (TM) ile diğer market karşılaştırması
    const fuelTx = ui.acat === 'araba' ? months.flatMap(ym => monthTx(ym).filter(t => t.type === 'out' && t.cat === 'araba' && t.fuel)) : [];
    const fuelGross = fuelTx.reduce((a, t) => a + (t.gross || t.amount), 0), fuelGs = fuelTx.reduce((a, t) => a + (t.gs || 0), 0);
    const gsYear = ui.acat === 'araba' ? db.tx.filter(t => t.gs && t.date.slice(0, 4) === curYm.slice(0, 4) && (ui.who === 'all' || payerOf(t) === ui.who)).reduce((a, t) => a + t.gs, 0) : 0;
    const tmSum = ui.acat === 'market' ? months.reduce((a, ym) => a + monthTx(ym).filter(t => t.type === 'out' && t.cat === 'market' && t.tm).reduce((x, t) => x + t.amount, 0), 0) : 0;
    const mx = Math.max(...vals), mi = vals.indexOf(mx);
    const max = niceMax(mx || 1);
    const W = 340, H = 160, L = 40, T = 14, B = 22, ch = H - T - B, slot = (W - L) / months.length, bw = Math.max(4, Math.min(22, slot - 6));
    const y = v => T + ch - v / max * ch;
    let g = '';
    [0, .5, 1].forEach(f => { const yy = y(max * f); g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${short(max * f)}</text>`; });
    const ay = y(avg); g += `<line x1="${L}" x2="${W}" y1="${ay}" y2="${ay}" stroke="var(--ink-2)" stroke-dasharray="3 3" opacity=".5"/>`;
    const step = Math.ceil(months.length / 12);
    months.forEach((ym, k) => {
      const v = vals[k], x = L + slot * k + (slot - bw) / 2, top = y(v), rr = Math.min(4, (T + ch - top) / 2, bw / 2);
      if (v > 0) g += `<path d="M${x},${T + ch} V${top + rr} q0,-${rr} ${rr},-${rr} h${bw - 2 * rr} q${rr},0 ${rr},${rr} V${T + ch} Z" fill="${c.color}" opacity="${k === mi ? 1 : .7}"><title>${AYLAR[+ym.slice(5) - 1]} ${ym.slice(0, 4)}: ${money(v)}</title></path>`;
      if (k === mi && v > 0) g += `<text x="${x + bw / 2}" y="${top - 4}" text-anchor="middle" style="fill:var(--ink);font-weight:800">${short(v)}</text>`;
      if (k % step === 0) g += `<text x="${L + slot * k + slot / 2}" y="${H - 6}" text-anchor="middle">${AY_K[+ym.slice(5) - 1]}</text>`;
    });
    const years = {}; months.forEach((ym, k) => years[ym.slice(0, 4)] = (years[ym.slice(0, 4)] || 0) + vals[k]);
    return `<section class="card bars">
      <div class="card-h"><h2>Kategori analizi</h2><small>${range}</small></div>
      ${perSeg}${chips}
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name)} aylık harcama">${g}</svg>
      <div class="stats">
        <div><span>Toplam</span><b class="num">${eur(tot)}</b></div>
        <div><span>Aylık ortalama</span><b class="num">${eur(avg)}</b></div>
        ${ui.acat === 'market' ? `<div><span>TM (Türk marketi)</span><b class="num">${eur(tmSum)}</b></div><div><span>Diğer market</span><b class="num">${eur(tot - tmSum)}</b></div><div><span>TM payı</span><b class="num">%${tot ? Math.round(tmSum / tot * 100) : 0}</b></div>` : ''}
        ${ui.acat === 'araba' ? `<div><span>Alınan benzin</span><b class="num">${eur(fuelGross)}</b></div><div><span>Gutschein ile</span><b class="num">${eur(fuelGs)}</b></div><div><span>${curYm.slice(0, 4)} Gutschein toplamı</span><b class="num">${eur(gsYear)}</b></div>` : ''}
        <div><span>En yüksek ay</span><b class="num">${mx ? AY_K[+months[mi].slice(5) - 1] + ' · ' + eur(mx) : '–'}</b></div>
      </div>
      <p class="hint">${ui.acat !== 'all' && allOut ? `${esc(c.name)} bu dönemdeki giderlerinin <b>%${Math.round(tot / allOut * 100)}</b>'i. ` : ''}${Object.keys(years).length > 1 || ui.per === '12' ? 'Yıllara göre: ' + Object.entries(years).map(([yy, v]) => `${yy} <b class="num">${eur(v)}</b>`).join(' · ') + '. ' : ''}Kesikli çizgi aylık ortalama. Kıyaslamak için birden fazla kategori seçebilirsin.</p>
    </section>${savedHtml}`;
  }

  // Artırılan para: her ay gelir − gider (yatırımlar gider sayılmaz)
  function savedCard(months, range) {
    const vals = months.map(ym => { const m = monthTx(ym); return sum(m, 'in') - sum(m, 'out'); });
    const tot = vals.reduce((a, v) => a + v, 0), avg = tot / months.length;
    const hi = niceMax(Math.max(1, ...vals)), lo = Math.min(0, ...vals) < 0 ? -niceMax(-Math.min(...vals)) : 0;
    const W = 340, H = 160, L = 40, T = 16, B = 22, ch = H - T - B, slot = (W - L) / months.length, bw = Math.max(4, Math.min(22, slot - 6));
    const y = v => T + (hi - v) / (hi - lo) * ch;
    let g = '';
    [hi, 0, lo].filter((v, i, a) => a.indexOf(v) === i).forEach(v => { g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? 'var(--muted)' : 'var(--line)'}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`; });
    const step = Math.ceil(months.length / 12);
    months.forEach((ym, k) => {
      const v = vals[k], x = L + slot * k + (slot - bw) / 2, y0 = y(0), y1 = y(v);
      if (v) g += `<rect x="${x}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="3" fill="${v >= 0 ? 'var(--in)' : '#d0a24c'}"><title>${AYLAR[+ym.slice(5) - 1]} ${ym.slice(0, 4)}: ${v >= 0 ? '+' : '−'}${money(Math.abs(v))}</title></rect>`;
      if (k === months.length - 1 || months.length <= 6) g += `<text x="${x + bw / 2}" y="${v >= 0 ? y1 - 4 : y1 + 11}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${short(v)}</text>`;
      if (k % step === 0) g += `<text x="${L + slot * k + slot / 2}" y="${H - 6}" text-anchor="middle">${AY_K[+ym.slice(5) - 1]}</text>`;
    });
    const best = vals.indexOf(Math.max(...vals));
    return `<section class="card bars">
      <div class="card-h"><h2>Artırılan para</h2><small>${range}</small></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Aylara göre artırılan para">${g}</svg>
      <div class="stats">
        <div><span>Toplam</span><b class="num" style="color:var(${tot >= 0 ? '--in-ink' : '--ink'})">${tot < 0 ? '−' : ''}${eur(Math.abs(tot))}</b></div>
        <div><span>Aylık ortalama</span><b class="num">${avg < 0 ? '−' : ''}${eur(Math.abs(avg))}</b></div>
        <div><span>En iyi ay</span><b class="num">${AY_K[+months[best].slice(5) - 1]} · ${eur(vals[best])}</b></div>
      </div>
      <p class="hint">Gelir eksi gider. Yatırımlar gider sayılmaz, yani yatırdığın para da artırılan paraya dahil.</p>
    </section>`;
  }

  // 50/30/20 kuralı: gelirin %50'si ihtiyaç (sabit), %30'u istek (değişken), %20'si birikim
  function ruleCard(gi, fk, vk, gv) {
    if (!gi) return '';
    const left = Math.max(0, gi - fk - vk);
    const rows = [['İhtiyaçlar', 'sabit giderler', fk / gi * 100, 50, '#6250d6', true], ['İstekler', 'değişken harcama', vk / gi * 100, 30, '#eb6834', true], ['Birikim', 'yatırım ve kalan', left / gi * 100, 20, 'var(--in)', false]];
    return `<section class="card">
      <div class="card-h"><h2>50/30/20 kontrolü</h2><small>bu ay</small></div>
      <div class="rule">${rows.map(([n, d, p, tgt, col, lower]) => {
        const ok = lower ? p <= tgt : p >= tgt;
        return `<div><div class="r-h"><span>${n} <small>${d}</small></span><span class="num" style="color:var(${ok ? '--in-ink' : '--out-ink'})">%${Math.round(p)} <small>/ hedef %${tgt}</small></span></div>
          <div class="track"><i style="width:${Math.min(100, p)}%;background:${col}"></i><em style="left:${tgt}%"></em></div></div>`;
      }).join('')}</div>
      <p class="hint">Yaygın bir bütçe kuralı: gelirin en fazla %50'si ihtiyaçlara, %30'u isteklere gitsin, en az %20'si birikime kalsın. Dikey çizgi hedefi gösterir.</p>
    </section>`;
  }

  /* ---------- Kategoriler ---------- */
  const CAT_EMO = ['🏋️', '⚽', '🛒', '🍞', '🍽️', '☕', '💊', '🏥', '🚗', '⛽', '🚌', '✈️', '🏠', '💡', '📱', '🎓', '📚', '👶', '🐶', '👕', '💇', '🎮', '🎬', '🎁', '💳', '🧾', '🔧', '🌱', '❤️', '💰'];
  function renderKategori() {
    const cats = db.cats[ui.kType];
    const count = id => db.tx.filter(t => t.type === ui.kType && t.cat === id).length;
    return `<div class="seg type">
        <button data-kt="out" data-v="out" aria-pressed="${ui.kType === 'out'}">Gider</button>
        <button data-kt="in" data-v="in" aria-pressed="${ui.kType === 'in'}">Gelir</button>
        <button data-kt="inv" data-v="inv" aria-pressed="${ui.kType === 'inv'}">Yatırım</button>

  // Paket 6: Gelir / Gider / Yatırım kutucuğuna basınca o ayın kayıtları sıkı bir liste olarak açılır
  let listBy = 'date';
  // "Günde ~€X" geçmişi ve tahmini: her gün için (hedef − o güne kadar harcanan) / kalan gün.
  // Tahmin modeli: son 6 ayın kişi 1 değişken harcamaları haftanın gününe göre ortalanır, bu ayın temposuyla yarı yarıya harmanlanır;
  // vadesi gelmemiş kişi 1 sabit giderleri de vade gününde düşülür.
  function dayModel() {
    const ym = curYm, [Y, M] = ym.split('-').map(Number), D = new Date(Y, M, 0).getDate(), t = +todayIso.slice(8), B = db.budget || 0;
    const isP1 = x => (x.payer || 'p1') === 'p1';
    const out = monthTx(ym).filter(x => x.type === 'out' && isP1(x));
    const dOf = x => x.date < ym + '-01' ? 0 : x.date > ym + '-' + pad(D) ? D : +x.date.slice(8);
    const before = d => out.filter(x => dOf(x) < d).reduce((a, x) => a + x.amount, 0);
    const spentAll = out.reduce((a, x) => a + x.amount, 0);
    const act = [];
    for (let d = 1; d <= t; d++) act.push({ d, v: d === t ? (B - spentAll) / (D - t + 1) : (B - before(d)) / (D - d + 1) });
    // geçmiş: haftanın günlerine göre ortalama değişken harcama
    const dow = Array(7).fill(0), cnt = Array(7).fill(0); let months = 0;
    for (let k = 1; k <= 6; k++) {
      const pm = ymAdd(ym, -k), [py, pmn] = pm.split('-').map(Number), pd = new Date(py, pmn, 0).getDate();
      const v = db.tx.filter(x => x.type === 'out' && x.cat !== 'sabit' && isP1(x) && txYm(x) === pm);
      if (!v.length) continue; months++;
      for (let d = 1; d <= pd; d++) cnt[(new Date(py, pmn - 1, d).getDay() + 6) % 7]++;
      v.forEach(x => { const dd = new Date(x.date); dow[(dd.getDay() + 6) % 7] += x.amount; });
    }
    const hist = dow.map((s, i) => cnt[i] ? s / cnt[i] : 0), histAvg = hist.reduce((a, b) => a + b, 0) / 7;
    const curVar = out.filter(x => !x.fx && dOf(x) < t).reduce((a, x) => a + x.amount, 0), curAvg = t > 1 ? curVar / (t - 1) : 0;
    let exp;
    if (months && histAvg > 0) { const k = curAvg ? Math.min(2, Math.max(.5, curAvg / histAvg)) : 1; exp = d => hist[(new Date(Y, M - 1, d).getDay() + 6) % 7] * (.5 + .5 * k); }
    else exp = () => curAvg;
    const fxDue = {}; db.fixed.forEach(f => { const st = fixedState(f, ym); if (st && st.status === 'wait' && payerOf(f) === 'p1') { const d = +st.due.slice(8); fxDue[d] = (fxDue[d] || 0) + st.amount; } });
    let L = B - spentAll; const fc = [];
    for (let d = t + 1; d <= D; d++) { L -= (d - 1 === t ? 0 : exp(d - 1)) + (fxDue[d - 1] || 0); fc.push({ d, v: L / (D - d + 1) }); }
    // ayın sonundaki tahmini kalan
    let endL = B - spentAll; for (let d = t + 1; d <= D; d++) endL -= exp(d) + (fxDue[d] || 0);

    return { D, t, act, fc, endL, expAvg, months, M };
  }

      if (T('#nxT')) { st.next = !st.next; st.nextAuto = false; return draw(); }
      if (T('#tmT')) { st.tm = !st.tm; return draw(); }
      if ((el = T('[data-shop]'))) { const n = root.querySelector('#nt'); st.note = n && n.value === el.dataset.shop ? '' : el.dataset.shop; if (n) n.value = st.note; return draw(); }
      if (T('#fuelT')) { st.fuel = !st.fuel; const n = root.querySelector('#nt'); if (n && st.fuel && !n.value.trim()) n.value = 'Benzin'; if (n && !st.fuel && n.value === 'Benzin') n.value = ''; return draw(); }
      if (T('#gsT')) { st.gsOn = !st.gsOn; if (st.gsOn) { st.fuel = true; const n = root.querySelector('#nt'); if (n && !n.value.trim()) n.value = 'Benzin'; } draw(); if (st.gsOn) setTimeout(() => { const i = root.querySelector('#gsAmt'); if (i) i.focus(); }, 30); return; }
      if ((el = T('[data-split]'))) { const k = el.dataset.split; st.split[k] = !st.split[k]; draw(); if (st.split[k]) setTimeout(() => { const i = root.querySelector(`[data-splitamt="${k}"]`); if (i) i.focus(); }, 30); return; }
      if (T('#addCat')) { st.adding = !st.adding; return draw(); }
      if (T('#sAdd')) { const n = root.querySelector('#sName').value.trim(); if (!n) return; const nc = addCat(st.type, n, root.querySelector('#sIcon').value.trim()); st.cat = nc.id; st.adding = false; return draw(); }
      if (T('#delBtn')) { close(); return withUndo('Kayıt silindi', () => { db.tx = db.tx.filter(t => t.id !== ed.id); }); }
      if (T('#saveBtn')) {
        const v = parseAmt(root.querySelector('#amt').value);
        if (!(v > 0)) { st.err = 'Tutarı yaz, örneğin 25 ya da 12,50.'; draw(true); return; }
        if (!st.cat) { st.err = 'Bir kategori seç.'; draw(); return; }
        const note = root.querySelector('#nt').value.trim();
        // "Sonraki aya at": kayıt, tarihi değişmeden bir sonraki ayın hesabına yazılır
        const ym2 = st.next ? ymAdd(ymOf(st.date), 1) : null, nx = ym2 ? { ym: ym2 } : {};
        // Ayrılan paylar (Sigara, Çocuk ekstra) ayrı kayıt olur, kalan tutar seçilen kategoriye yazılır
        const parts = ed || st.type !== 'out' ? [] : SPLITS.filter(([id]) => id !== st.cat && st.split[id]).map(([id, l]) => [id, l, parseAmt(st.splitAmt[id] || (root.querySelector(`[data-splitamt="${id}"]`) || {}).value || '')]);
        const pSum = parts.reduce((x, p) => x + p[2], 0);
        if (parts.length && (parts.some(p => !(p[2] > 0)) || pSum >= v)) { st.err = 'Ayırdığın tutarları yaz; toplamları alışveriş tutarından küçük olmalı.'; draw(); return; }
        const tm = st.type === 'out' && st.cat === 'market' && st.tm ? { tm: true } : {};
        const isCar = st.type === 'out' && st.cat === 'araba', gsV = isCar && st.gsOn ? parseAmt((root.querySelector('#gsAmt') || {}).value || st.gs) : 0;
        if (isCar && st.gsOn && (!(gsV > 0) || gsV > v)) { st.err = 'Gutschein tutarını yaz; benzin tutarından büyük olamaz.'; draw(); return; }
        const fuelX = isCar && (st.fuel || gsV) ? Object.assign({ fuel: true }, gsV ? { gs: gsV, gross: v } : {}) : {};
        const cash = gsV ? Math.round((v - gsV) * 100) / 100 : v;
        if (parts.length) {
          const ts = Date.now(), rest = Math.round((v - pSum) * 100) / 100;
          db.tx.push({ id: 't' + ts, ts, type: 'out', cat: st.cat, amount: rest, date: st.date, note, payer: st.payer, ...nx, ...tm });
          parts.forEach(([id, l, pv], k) => db.tx.push({ id: 't' + ts + id, ts: ts + 1 + k, type: 'out', cat: id, amount: pv, date: st.date, note, payer: st.payer, ...nx }));
          ui.last.out = st.cat; ui.lastPayer = st.payer;
          save(); ui.ym = ym2 || ymOf(st.date); close(); render();
          return toast(`${catOf('out', st.cat).name} ${money(rest)} · ` + parts.map(p => `${p[1]} ${money(p[2])}`).join(' · '));
        }
        if (ed) { Object.assign(ed, { type: st.type, cat: st.cat, amount: cash, date: st.date, note, payer: st.payer }); if (ym2) ed.ym = ym2; else delete ed.ym; if (tm.tm) ed.tm = true; else delete ed.tm; delete ed.fuel; delete ed.gs; delete ed.gross; Object.assign(ed, fuelX); }
        else db.tx.push(Object.assign({ id: 't' + Date.now(), ts: Date.now(), type: st.type, cat: st.cat, amount: cash, date: st.date, note, payer: st.payer }, nx, tm, fuelX));
        ui.last[st.type] = st.cat; ui.lastPayer = st.payer;
        save(); ui.ym = ym2 || ymOf(st.date); close(); render();
        toast(gsV ? `Benzin ${money(v)} · GS ${money(gsV)} · gidere ${money(cash)}` : ed ? 'Kayıt güncellendi' : TN[st.type] + ' kaydedildi: ' + money(v));
      }
    };
    document.addEventListener('keydown', onKey);
    draw(!ed);
  }

  // PIN kilidi: PIN'in kendisi değil özeti telefonda saklanır; açılışta ve 1 dakikadan uzun arka planda kalınca sorulur
  // Kural: soğuk açılışta sor; aşağı çekip yenilemede (aynı oturum, 5 dk içinde) sorma; 5 dk'dan uzun arka planda kalınca sor
  const LOCK_MS = 5 * 60000;
  let fresh = true; try { const ok = sessionStorage.getItem(PINK + 'Ok'), seen = +(sessionStorage.getItem(PINK + 'Seen') || 0); fresh = !(ok && seen && Date.now() - seen < LOCK_MS); } catch (er) {}
  if (fresh) { try { sessionStorage.removeItem(PINK + 'Ok'); } catch (er) {} lockScreen(); }
  const seenNow = () => { try { sessionStorage.setItem(PINK + 'Seen', Date.now()); } catch (er) {} };
  seenNow(); setInterval(() => { if (!document.hidden) seenNow(); }, 30000);
  window.addEventListener('pagehide', seenNow);
  let hidAt = 0;
  document.addEventListener('visibilitychange', () => { if (document.hidden) { hidAt = Date.now(); seenNow(); } else { if (hidAt && Date.now() - hidAt > LOCK_MS) lockScreen(); seenNow(); } });
  render();
})();
</script>
<style>#instBar[hidden] { display: none !important; }</style>
<div id="instBar" hidden style="position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;max-width:440px;margin:0 auto;background:#FF5A00;color:#fff;border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);font:600 14px/1.3 'Plus Jakarta Sans',system-ui,sans-serif">
  <span style="flex:1">Cüzdan'ı telefonuna uygulama olarak yükle</span>
  <button id="instBtn" style="border:0;background:#fff;color:#FF5A00;font:800 14px 'Plus Jakarta Sans',system-ui,sans-serif;border-radius:10px;padding:9px 14px">Yükle</button>
  <button id="instX" aria-label="Kapat" style="border:0;background:none;color:#fff;font-size:20px;line-height:1;padding:4px">×</button>
</div>
<script>
// Chrome yükleme penceresini tek butonla açar; uygulama zaten yüklüyse ya da tarayıcı desteklemiyorsa görünmez
(function () {
  var ev = null, bar = document.getElementById('instBar');
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ev = e; bar.hidden = false; });
  document.getElementById('instBtn').onclick = function () { if (!ev) return; ev.prompt(); ev.userChoice.then(function () { bar.hidden = true; ev = null; }); };
  document.getElementById('instX').onclick = function () { bar.hidden = true; };
  addEventListener('appinstalled', function () { bar.hidden = true; });
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
